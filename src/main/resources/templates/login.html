<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head th:replace="~{fragments/common-head :: styles('UniBook - Вхід')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
        <h1 class="h3 mb-1 fw-bold">UniBook</h1>
        <p class="text-muted small">Вхід до системи видавництва</p>
    </div>
    <div th:if="${param.error}" class="alert alert-danger py-2 mb-3 text-center small" role="alert">
        Невірний логін або пароль.
    </div>
    <div th:if="${param.logout}" class="alert alert-secondary py-2 mb-3 text-center small" role="alert">
        Ви успішно вийшли з акаунту.
    </div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="someone@example.com" required autofocus />
        </div>
        <div class="mb-4">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-dark w-100">Увійти</button>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="uk">
<head th:replace="~{fragments/common-head :: styles('UniBook - Доступ обмежено')}"></head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
<div class="card border-0 shadow-sm p-4 text-center" style="width: 100%; max-width: 420px;">
    <div class="mb-3">
        <span class="badge bg-secondary text-light fs-6 px-3 py-2">Помилка 403</span>
    </div>

    <h1 class="h3 fw-bold mb-2">Доступ заборонено</h1>
    <p class="text-muted small mb-4">
        У вас немає достатніх прав для перегляду цієї сторінки.
    </p>

    <div class="d-grid gap-2">
        <a sec:authorize="hasAnyRole('AUTHOR', 'EDITOR', 'DESIGNER')"
           th:href="@{/manuscripts/my}" class="btn btn-dark">Повернутися до моїх рукописів</a>

        <a sec:authorize="hasAnyRole('CHIEF_EDITOR', 'ACCOUNTANT', 'ADMIN')"
           th:href="@{/manuscripts}" class="btn btn-dark">Повернутися до рукописів</a>

        <a sec:authorize="isAnonymous()"
           th:href="@{/login}" class="btn btn-dark">Перейти до входу</a>
    </div>
</div>
</body>
</html>

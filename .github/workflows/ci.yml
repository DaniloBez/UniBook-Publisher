name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  build:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Потрібно для аналізу Git blame в SonarCloud

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Start Infrastructure (Docker Compose)
        run: docker compose up -d minio

      - name: Wait for MinIO & Create Bucket
        run: |
          docker run --network host --rm --entrypoint /bin/sh minio/mc -c "
            until mc alias set myminio http://localhost:9000 minioadmin minioadmin; do
              echo 'Waiting for MinIO...'
              sleep 2
            done
            mc mb myminio/unibook --ignore-existing
          "

      - name: Run Check & Tests with Coverage
        run: ./gradlew check jacocoTestReport

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info

      - name: Build Application JAR
        run: ./gradlew bootJar

      - name: Install Newman & Extra Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Spring Boot & Newman E2E Tests
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: unibook
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          FILE_STORAGE_ENABLED: "true"
          FILE_STORAGE_TYPE: "S3"
        run: |
          java -jar build/libs/*.jar > app.log 2>&1 &
          
          echo "Очікування запуску Spring Boot на порту 8080..."
          timeout 60s bash -c 'until curl -s http://localhost:8080/h2-console > /dev/null; do sleep 2; done' || (echo "=== Помилка запуску Spring Boot. Логи: ===" && cat app.log && exit 1)
          
          mkdir -p postman/results
          newman run postman/unibook-e2e-workflow.postman_collection.json \
            --working-dir postman \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export postman/results/newman-report.xml \
            --reporter-htmlextra-export postman/results/newman-report.html \
            --bail

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-results
          path: postman/results/
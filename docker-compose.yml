services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: unibook-minio
    restart: unless-stopped
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_REGION_NAME: ${S3_REGION:-us-east-1}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: unibook-minio-init
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-unibook}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\"; do
        echo 'Waiting for MinIO to become ready...'
        sleep 1
      done;
      mc mb --ignore-existing \"local/$$S3_BUCKET\";
      echo 'Bucket ready!';
      exit 0;
      "

volumes:
  minio_data:
